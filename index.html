<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brinca João 💙 — Um mundo de brincadeiras</title>
    <meta
      name="description"
      content="Brinca João: um mundo de brincadeiras feito com carinho. Jogos infantis acessíveis, calmos e gratuitos, para brincar no próprio ritmo."
    />
    <meta name="theme-color" content="#CFE8FF" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Ícones e instalação na tela inicial -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Brinca João" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Compartilhamento (redes sociais pedem endereços completos) -->
    <link rel="canonical" href="https://brincajoao.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Brinca João" />
    <meta property="og:url" content="https://brincajoao.netlify.app/" />
    <meta property="og:title" content="Brinca João 💙" />
    <meta
      property="og:description"
      content="Um mundo de brincadeiras feito com carinho! Jogos infantis acessíveis e gratuitos."
    />
    <meta property="og:image" content="https://brincajoao.netlify.app/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pipo, um balão azul sorridente, flutuando sobre uma ilha com brinquedos."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- As fontes ficam no próprio site: nenhuma requisição a terceiros. -->
    <link
      rel="preload"
      href="/src/assets/fonts/nunito-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/fredoka-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px; text-align: center">
        O Brinca João precisa do JavaScript ligado para funcionar. Peça ajuda a um adulto para
        ligar o JavaScript no navegador.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
